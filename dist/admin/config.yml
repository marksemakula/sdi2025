backend:
  name: git-gateway
  branch: main

# Netlify Large Media support (optional)
media_folder: "public/images/blog"
public_folder: "/images/blog"

# Logo for the CMS
logo_url: "/images/SDI_Logo.png"

# Site URL
site_url: https://specialistdoctors-international.org

# Editorial workflow for draft/review/publish
publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "MMMM D, YYYY" }
      - { label: "Author", name: "author", widget: "string", default: "SDI Medical Team" }
      - { label: "Category", name: "category", widget: "select", options: ["Maternal Health", "Women's Health", "General Health", "Medical News", "Community", "Announcements"], default: "General Health" }
      - { label: "Featured Image", name: "image", widget: "image", required: true }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: true, hint: "A short summary for the blog listing (150-200 characters)" }
      - { label: "Content", name: "content", widget: "markdown", required: true }
      - { label: "Published", name: "published", widget: "boolean", default: true }
