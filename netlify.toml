[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify built-in services must not be intercepted by the SPA catch-all.
# Explicit 200 passthroughs ensure Identity and Functions operate correctly.
[[redirects]]
  from = "/.netlify/identity"
  to = "/.netlify/identity"
  status = 200
  force = false

[[redirects]]
  from = "/.netlify/identity/*"
  to = "/.netlify/identity/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

# Pass Netlify/Decap CMS admin files directly to their static counterparts.
# Must be declared BEFORE the SPA catch-all so config.yml is never shadowed.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = false

# SPA catch-all – all other routes render the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200