[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA catch-all – serves the React app for all client-side routes.
# Netlify serves any existing file in the publish directory BEFORE this rule
# fires (force defaults to false), so /admin/config.yml, /admin/index.html,
# and /.netlify/* API calls are all handled correctly without explicit rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200